name: cariasec
services:
  backend:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile
      target: backend
    environment:
      NODE_ENV: production
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN in .env}
      MAX_ROOMS: ${MAX_ROOMS:-200}
      DATABASE_PATH: /app/data/cariasec.sqlite
    volumes:
      - game-data:/app/data
    restart: unless-stopped
    init: true
    mem_limit: 512m
    cpus: 1.25
    pids_limit: 100
    read_only: true
    tmpfs:
      - /tmp:size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  web:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile
      target: web
    ports:
      - '127.0.0.1:${WEB_PORT:-8088}:8080'
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 50
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m
      - /var/run:size=8m
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
volumes:
  game-data:
