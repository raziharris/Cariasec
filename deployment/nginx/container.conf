map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 16k;
    # Docker DNS must be re-resolved after the backend container is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:3001;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location = /healthz { access_log off; return 200 'ok'; }
    location /matchmake/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location ~ ^/[A-Za-z0-9_-]+/[A-Z2-9]{6}$ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_buffering off;
    }
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
    }
    location /assets/ { expires 1y; try_files $uri =404; }
    location /cards/ { expires 1d; try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
